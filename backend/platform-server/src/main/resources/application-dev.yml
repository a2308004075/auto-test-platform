# 开发环境配置

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auto_test_platform?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: pp2024

  redis:
    host: localhost
    port: 6379
    timeout: 5000

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /

  flyway:
    validate-on-migrate: true
    clean-disabled: false

# JWT 密钥（开发环境，生产环境必须更换）
jwt:
  secret: dev-secret-key-auto-test-platform-2024-change-in-production

# 知识库 LLM 配置（百炼 OpenAI 兼容模式）
# API Key 通过环境变量 LLM_API_KEY 注入，或直接修改下方默认值
knowledge:
  llm:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${LLM_API_KEY:sk-xxx}
    chat-model: ${LLM_CHAT_MODEL:qwen-plus}
    embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimension: 1536

# 日志级别与文件输出由 logback-spring.xml 统一管理

# MyBatis-Plus 日志配置继承 application.yml，此处不再重复声明
